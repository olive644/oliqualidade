<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title description">
  <title id="title">Marca Oli</title>
  <desc id="description">Mascote Oli deitado, com o dorso formando um gráfico ascendente.</desc>
  <defs>
    <linearGradient id="body" x1="8" y1="14" x2="56" y2="53" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4B86FF"/>
      <stop offset="0.48" stop-color="#1553D5"/>
      <stop offset="1" stop-color="#092F91"/>
    </linearGradient>
  </defs>

  <!-- O dorso sobe em três níveis como barras de um gráfico. -->
  <path
    fill="url(#body)"
    d="M5 50V41.5C5 37.9 7.9 35 11.5 35H17V31C17 27.7 19.7 25 23 25H29V20.5C29 16.9 31.9 14 35.5 14H39C43.8 14 47.8 17.4 48.7 22L50.5 31.4C54.8 32.5 58 36.4 58 41V45.5C58 48 56 50 53.5 50H5Z"
  />
  <circle cx="47.5" cy="29.5" r="6.2" fill="#092F91"/>
  <path fill="#F7FBFF" d="M43 25.8c0-2.8 2.2-5 5-5s5 2.2 5 5v12.7H43V25.8Z"/>
  <circle cx="46.8" cy="31.3" r="1.55" fill="#071B4C"/>
  <circle cx="55.2" cy="39.2" r="4.7" fill="#F7FBFF"/>
  <ellipse cx="56.8" cy="39.6" rx="2.3" ry="1.8" fill="#071B4C"/>
  <path d="M51.1 44.4c1.4 1.4 3.1 1.8 4.8 1.2" fill="none" stroke="#071B4C" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Linhas de base unem a ideia de mascote à de visualização de dados. -->
  <path d="M8 50h48" fill="none" stroke="#61E0C2" stroke-width="3" stroke-linecap="round"/>
  <path d="M13 44v3M23 36v11M35 27v20" fill="none" stroke="#F7FBFF" stroke-opacity=".36" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="44.2" cy="27.8" r=".65" fill="#F7FBFF"/>
</svg>
