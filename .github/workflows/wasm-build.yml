name: Build WASM package (manual)

# Disparo manual apenas. O binário `src/wasm/oli-ooxml-core/` é versionado
# como artefato pré-compilado (ver scripts/build-ooxml-wasm.mjs); este
# workflow existe porque o wasm-pack pode não funcionar em toda máquina
# local (ex.: Universal CRT ausente no Windows). Builda e valida no Ubuntu,
# onde o crate já compila de forma confiável, e publica o pacote como
# artefato para download manual — não commita nada sozinho.

on:
  workflow_dispatch: {}
  push:
    branches: [fix/ooxml-formato-moeda-corpus]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Build Wasm package
        run: node scripts/build-ooxml-wasm.mjs
      - name: Test Rust core
        run: cargo test --locked --manifest-path rust/oli-ooxml-core/Cargo.toml
      - name: Smoke test the rebuilt package
        run: node scripts/test-ooxml-wasm.mjs
      - name: Upload Wasm package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: oli-ooxml-core-wasm
          path: src/wasm/oli-ooxml-core
          if-no-files-found: error
