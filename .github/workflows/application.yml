name: Application CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-ci-${{ github.workflow }}-${{ github.ref }}
  # PRs da mesma branch podem substituir a execução anterior. Na main, cada
  # commit entra na fila para não aparecer como cancelado no histórico.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint, test, build and performance
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint source
        run: npm run lint

      - name: Test, typecheck, build and check performance budget
        run: npm run verify

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit for high/critical vulnerabilities
        # A resolução forçada de uuid elimina o achado moderado que vinha do
        # verificador independente ExcelJS, mas o gate segue em high: um aviso
        # moderado numa dependência transitiva sem correção disponível travaria
        # PRs sem relação nenhuma com ele. Rodar `npm audit` local sem
        # --audit-level quando precisar do quadro completo.
        run: npm audit --audit-level=high

      # Inventário do que entra no pacote, no formato CycloneDX. Gerado pelo
      # próprio npm, e não por uma action de terceiro: acrescentar mais um
      # fornecedor à cadeia para documentar a cadeia seria contraditório.
      - name: Generate SBOM (CycloneDX)
        run: npm sbom --sbom-format cyclonedx --omit dev > sbom.cyclonedx.json

      - name: Publish SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json
          # 90 dias cobre o intervalo entre versões com folga; guardar para
          # sempre acumularia um inventário por execução sem ninguém consultar.
          retention-days: 90

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Histórico completo: gitleaks escaneia commits, não só o
          # working tree — um checkout raso (padrão em pull_request)
          # só veria o commit de merge.
          fetch-depth: 0

      - name: Download gitleaks
        # Repo é privado de conta pessoal: o secret scanning nativo do
        # GitHub (GHAS) só é gratuito em repositório público (ver seção
        # 104 do audit). gitleaks é MIT, roda o binário direto sem
        # depender da gitleaks-action oficial (que exige licença paga
        # para uso em organização) — mesmo binário testado localmente
        # antes desta mudança, histórico completo sem achados.
        run: |
          curl -sL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks

      - name: Scan for leaked secrets
        run: ./gitleaks detect --source . --redact -v

  security-smoke:
    name: Security headers and CORS smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start dev server
        # Roda o mesmo server.ts (fetch handler) que a produção, via a
        # pipeline de SSR do dev server do TanStack Start — não é o bundle
        # exato do preset Vercel (que exige o formato de runtime do próprio
        # Vercel para rodar fora da plataforma), mas exercita o mesmo
        # caminho de código de segurança/sessão.
        #
        # --host é necessário: sem ele, duas execuções reais desta CI
        # tiveram toda tentativa de curl para 127.0.0.1 recusada durante
        # todo o laço de espera, mesmo com o Vite já tendo impresso
        # "ready" e "Local: http://localhost:3000/" — o próprio banner do
        # Vite avisa "Network: use --host to expose", ou seja, por padrão
        # ele não fica alcançável em todas as interfaces locais neste
        # runner. `-- --host` repassa o flag para o Vite por baixo do
        # script npm.
        run: |
          OLI_SESSION_SECRET="ci-smoke-test-session-secret-not-a-real-credential" \
            npm run dev -- --host > dev-server.log 2>&1 &
          echo $! > dev-server.pid

      - name: Wait for dev server
        run: |
          # O Vite anuncia "ready" e libera a porta antes de terminar o
          # pré-empacotamento de dependências ("bundling dependencies...");
          # numa checkout fria de CI (sem cache de node_modules/.vite),
          # empacotar recharts/xlsx/leaflet/radix-ui pela primeira vez
          # atrasa a PRIMEIRA resposta HTTP real por bem mais que alguns
          # segundos — confirmado em duas execuções reais desta CI com
          # --max-time 3: cada tentativa era cortada antes de terminar, o
          # empacotamento nunca progredia o suficiente e o laço esgotava
          # sem nunca conseguir uma resposta completa. Cada tentativa
          # agora tem até 60s para completar.
          for i in $(seq 1 10); do
            if curl -sf --max-time 60 -o /dev/null http://127.0.0.1:3000/; then
              echo "Servidor pronto."
              exit 0
            fi
            sleep 2
          done
          echo "Servidor não respondeu a tempo."
          cat dev-server.log
          exit 1

      - name: Run security smoke test
        env:
          OLI_SMOKE_BASE_URL: http://127.0.0.1:3000
          OLI_EXPECT_CHAT_SESSION: "1"
        run: npm run test:security-smoke

      - name: Stop dev server
        if: always()
        run: kill "$(cat dev-server.pid)" 2>/dev/null || true

  compatibility:
    name: Workbook compatibility matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate compatibility report
        run: npm run compatibility:report

      - name: Upload compatibility report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: workbook-compatibility-report
          path: |
            test-results/workbook-compatibility-report.json
            test-results/workbook-compatibility-report.md
          retention-days: 30

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start dev server
        # Mesmo mecanismo já usado pelo job security-smoke acima (ver
        # comentário lá para o histórico de por que precisa de --host e do
        # laço de espera com curl).
        run: |
          OLI_SESSION_SECRET="ci-e2e-test-session-secret-not-a-real-credential" \
            npm run dev -- --host > dev-server.log 2>&1 &
          echo $! > dev-server.pid

      - name: Wait for dev server
        run: |
          for i in $(seq 1 10); do
            if curl -sf --max-time 60 -o /dev/null http://127.0.0.1:3000/; then
              echo "Servidor pronto."
              exit 0
            fi
            sleep 2
          done
          echo "Servidor não respondeu a tempo."
          cat dev-server.log
          exit 1

      - name: Run E2E tests
        # OLI_E2E_BASE_URL aponta o Playwright para o servidor já confirmado
        # pronto acima, em vez do webServer nativo do Playwright: o probe
        # HTTP dele colide com uma corrida real do dev server (o ambiente
        # "nitro" do Vite responde 503/trava por dezenas de segundos bem no
        # instante em que a porta abre) e nunca converge dentro do timeout.
        # Confirmado localmente antes desta mudança.
        env:
          OLI_E2E_BASE_URL: http://127.0.0.1:3000
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Stop dev server
        if: always()
        run: kill "$(cat dev-server.pid)" 2>/dev/null || true
