name: Rust OOXML core

on:
  pull_request:
    paths:
      - "rust/**"
      - "src/wasm/**"
      - "scripts/*ooxml-wasm.mjs"
      - "contracts/ooxml-inventory.schema.json"
      - ".github/workflows/rust.yml"
  push:
    branches: [main]
    paths:
      - "rust/**"
      - "src/wasm/**"
      - "scripts/*ooxml-wasm.mjs"
      - "contracts/ooxml-inventory.schema.json"
      - ".github/workflows/rust.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: Check formatting
        run: cargo fmt --manifest-path rust/oli-ooxml-core/Cargo.toml -- --check
      - name: Lint Rust core
        run: cargo clippy --locked --manifest-path rust/oli-ooxml-core/Cargo.toml --all-targets -- -D warnings
      - name: Test Rust core
        run: cargo test --locked --manifest-path rust/oli-ooxml-core/Cargo.toml
      - name: Check Wasm target
        run: cargo check --locked --target wasm32-unknown-unknown --manifest-path rust/oli-ooxml-core/Cargo.toml
      - name: Smoke test committed Wasm package
        run: node scripts/test-ooxml-wasm.mjs
