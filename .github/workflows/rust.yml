name: Rust OOXML core

on:
  pull_request:
    paths:
      - "rust/**"
      - "src/wasm/**"
      - "src/lib/wasm-shadow-*.ts"
      - "src/lib/workbook-reading-engine.ts"
      - "src/lib/workbook-reader.ts"
      - "test-fixtures/wasm-corpus-manifest.json"
      - "scripts/generate-workbook-corpus.mjs"
      - "scripts/*ooxml-wasm.mjs"
      - "contracts/ooxml-inventory.schema.json"
      - ".github/workflows/rust.yml"
  push:
    branches: [main]
    paths:
      - "rust/**"
      - "src/wasm/**"
      - "src/lib/wasm-shadow-*.ts"
      - "src/lib/workbook-reading-engine.ts"
      - "src/lib/workbook-reader.ts"
      - "test-fixtures/wasm-corpus-manifest.json"
      - "scripts/generate-workbook-corpus.mjs"
      - "scripts/*ooxml-wasm.mjs"
      - "contracts/ooxml-inventory.schema.json"
      - ".github/workflows/rust.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: Check formatting
        run: cargo fmt --manifest-path rust/oli-ooxml-core/Cargo.toml -- --check
      - name: Lint Rust core
        run: cargo clippy --locked --manifest-path rust/oli-ooxml-core/Cargo.toml --all-targets -- -D warnings
      - name: Test Rust core
        run: cargo test --locked --manifest-path rust/oli-ooxml-core/Cargo.toml
      - name: Check Wasm target
        run: cargo check --locked --target wasm32-unknown-unknown --manifest-path rust/oli-ooxml-core/Cargo.toml
      - name: Smoke test committed Wasm package
        run: node scripts/test-ooxml-wasm.mjs

  corpus-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install application dependencies
        run: npm ci
      - name: Measure real Wasm corpus and apply promotion gate
        run: npm run wasm:corpus
      - name: Upload Wasm corpus report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wasm-corpus-report
          path: test-results/wasm-corpus-report.json
          if-no-files-found: warn
